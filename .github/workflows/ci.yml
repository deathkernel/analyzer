name: CodeFlow CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Python regression tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: JavaScript syntax checks
        run: node --check forge-ui.js && node --check graph-controls-plus.js
